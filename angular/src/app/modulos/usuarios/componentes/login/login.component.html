<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card login-card">
        <div class="card-header login-header">
          <h3>Iniciar Sesión</h3>
        </div>

        <div class="card-body p-4">

          <div *ngIf="errorLogin || errorMensaje" class="alert alert-danger custom-alert">
            {{ errorLogin || errorMensaje }}
          </div>

          <form (ngSubmit)="onLogin()">
            <div class="mb-4">
              <label for="email" class="form-label custom-label">Email</label>
              <input type="email"
                     class="form-control custom-input"
                     id="email"
                     name="email"
                     placeholder="ejemplo@correo.com"
                     [(ngModel)]="model.email"
                     required>
            </div>

            <div class="mb-4">
              <label for="contrasena" class="form-label custom-label">Contraseña</label>
              <input type="password"
                     class="form-control custom-input"
                     id="contrasena"
                     name="contrasena"
                     placeholder="••••••••"
                     [(ngModel)]="model.contrasena"
                     required>
            </div>

            <button type="submit" class="btn btn-ingresar w-100">
              INGRESAR
            </button>
          </form>

          <div class="mt-4 text-center footer-text">
            <span>¿No tienes cuenta?</span>
            <br>
            <a (click)="abrirRegistroClick()" class="register-link">
              ¡Regístrate aquí!
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
