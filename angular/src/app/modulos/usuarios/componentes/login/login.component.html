<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Iniciar Sesión</h3>
        </div>
        <div class="card-body">
          <div *ngIf="errorLogin" class="alert alert-danger">
            {{ errorLogin }}
          </div>

          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email"
                     class="form-control"
                     id="email"
                     name="email"
                     [(ngModel)]="model.email"
                     required>
            </div>
            <div class="mb-3">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input type="password"
                     class="form-control"
                     id="contrasena"
                     name="contrasena"
                     [(ngModel)]="model.contrasena"
                     required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100"
                    [disabled]="!loginForm.form.valid">
              Ingresar
            </button>
          </form>

          <div class="mt-3 text-center">
            ¿no tienes cuenta?
            <a (click)="abrirRegistroClick()" style="cursor: pointer; color: blue;">
              Regístrate aquí
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
