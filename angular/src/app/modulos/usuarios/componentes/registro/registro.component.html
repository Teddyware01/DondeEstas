<div class="registro-card">
  <button type="button" class="btn-close" (click)="cerrar()">✕</button>

  <h2>Crear Cuenta</h2>
  <div class="alert-success" *ngIf="registroExitoso">
    <h3>¡Bienvenido! 🐶</h3>
    <p>Tu cuenta ha sido creada exitosamente.</p>
  </div>
  <!-- form [formGroup]="registroForm" (ngSubmit)="onSubmit()" *ngIf="!registroExitoso"> -->
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div style="display: flex; gap: 10px;">
      <div class="form-group" style="flex: 1;">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" placeholder="Tu nombre">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>Apellido</label>
        <input type="text" formControlName="apellido" placeholder="Tu apellido">
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" formControlName="email" required autocomplete="off">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="contrasena" formControlName="contrasena" required autocomplete="new-password">
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" formControlName="telefono" placeholder="Para contactarte si encuentras algo">
    </div>

    <div class="form-group">
      <label>Ciudad</label>
      <input type="text" formControlName="ciudad" placeholder="Tu ciudad actual">
    </div>

    <div class="form-group">
      <label>Barrio (Opcional)</label>
      <input type="text" formControlName="barrio">
    </div>

    <button type="submit" class="btn-submit" [disabled]="registroForm.invalid">
      REGISTRARME
    </button>

    <div class="alert-error" *ngIf="errorRegistro">
      {{ errorRegistro }}
    </div>
  </form>
</div>
