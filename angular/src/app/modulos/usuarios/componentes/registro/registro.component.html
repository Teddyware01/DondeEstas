<div class="container">
  <h2>Registro de Nuevo Usuario</h2>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" formControlName="nombre" class="form-control">
      <div *ngIf="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched" class="alert alert-danger">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" class="form-control">
    </div>

    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" formControlName="contrasena" class="form-control">
    </div>

    <div *ngIf="errorRegistro" class="alert alert-warning mt-3">{{ errorRegistro }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="!registroForm.valid">
      Registrarse
    </button>
  </form>

  <p *ngIf="registroExitoso" class="mt-3 text-success">¡Registro completado! Por favor, inicia sesión.</p>
</div>
