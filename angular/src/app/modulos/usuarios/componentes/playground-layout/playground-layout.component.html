<div class="layout-container">
  <header class="main-header">
    <h1>¿Dónde Estás? - Playground</h1>
    <nav>
      <!-- links -->
      <a routerLink="/usuarios/login">Login</a> |
      <a routerLink="/usuarios/registro">Registro</a>
    </nav>
  </header>

  <!-- 2. Área de Contenido Principal -->
  <main class="content-area">

    <h2>Lista de Usuarios (Prueba de TS)</h2>
    <!-- Iteramos el array que definiste usando *ngFor [2] -->
    <div class="user-card" *ngFor="let usuario of usuariosDePrueba">
      <h3>{{ usuario.nombre }}</h3>
      <p><strong>ID:</strong> {{ usuario.id }}</p>
      <p><strong>Rol:</strong> <span [class.admin]="usuario.rol === 'Administrador'">{{ usuario.rol }}</span></p>
    </div>

    <!-- IMPORTANTE: Si este es un Layout "padre" que cargará otras páginas dentro,
         necesitas un router-outlet [3]. Si solo es una página de prueba, no es necesario aún. -->
    <hr>
    <p><em>Aquí se cargarían las vistas hijas si usas rutas hijas:</em></p>
    <!-- <router-outlet></router-outlet> -->

  </main>

  <!-- 3. Footer -->
  <footer class="main-footer">
    <p>&copy; 2025 Trabajo Final - TTPS</p>
  </footer>
</div>
