<div class="main-container">

  <h2 class="titulo-seccion">Mascotas Perdidas Recientemente</h2>
  <button class="btn-nueva-mascota" (click)="abrirModalCrear()">
    + Nueva Mascota Perdida
  </button>
  <div class="grid-container">
    <div class="pet-card" *ngFor="let mascota of listaMascotas">
      <div class="card-image">
        <img
          [src]="mascota.imagenBase64 ? mascota.imagenBase64 : 'assets/placeholder-pet.png'"
          [alt]="mascota.nombre"
          class="imagen-mascota"
        >

        <span class="badge-estado">{{ mascota.estado }}</span>
      </div>

      <div class="card-info">
        <h3 class="pet-name">{{ mascota.nombre }}</h3>

        <div class="pet-details">
          <p><strong>Tamaño:</strong> {{ mascota.tamano }}</p>
          <p><strong>Perdido el:</strong> {{ mascota.fechaPerdida | date:'dd/MM/yyyy' }}</p>
          <p class="ubicacion">📍 {{ mascota.ubicacion }}</p>
        </div>

        <button class="btn-ver-mas">VER MÁS</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="mostrarModal" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <span class="close-btn" (click)="cerrarModal()">&times;</span>
    <h2>{{ modoEdicion ? 'Editar Mascota' : 'Nueva Mascota Perdida' }}</h2>

    <form (ngSubmit)="guardarMascota()">
      <label>Nombre:</label>
      <input [(ngModel)]="mascotaForm.nombre" name="nombre" required>

      <label>Tamaño:</label>
      <select [(ngModel)]="mascotaForm.tamano" name="tamano">
        <option value="Chico">Chico</option>
        <option value="Mediano">Mediano</option>
        <option value="Grande">Grande</option>
      </select>

      <label>Estado actual:</label>
      <select [(ngModel)]="mascotaForm.estado" name="estado" required>
        <option *ngFor="let opcion of estadosPosibles" [value]="opcion.clave">
          {{ opcion.label }}
        </option>
      </select>

      <label>Color:</label>
      <input [(ngModel)]="mascotaForm.color" name="color">

      <label>Fecha de pérdida:</label>
      <input type="date" [(ngModel)]="mascotaForm.fechaPerdida" name="fechaPerdida" required>

      <label>Ubicación:</label>
      <div class="map-container">
        <div #map class="map"></div>
      </div>
      <input type="hidden" [(ngModel)]="mascotaForm.ubicacion" name="ubicacion">

      <label>Imagen (opcional):</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*">

      <div class="modal-actions">
        <button type="button" (click)="cerrarModal()">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
